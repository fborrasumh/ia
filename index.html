<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplicaciones IA · fborrasumh · UMH</title>
<meta name="description" content="Catálogo de aplicaciones de IA para docencia, evaluación, investigación y simulación clínica. Universidad Miguel Hernández de Elche. / AI tools for teaching, assessment, research and clinical simulation.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --border: #e4e3df;
  --border-strong: #cccbc6;
  --text: #1a1916;
  --muted: #7a7872;
  --radius: 8px;
  --doc: #1a4fd8;
  --eva: #b83a0c;
  --inv: #126649;
  --sim: #c2186b;
  --uti: #6429a8;
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */
header {
  background: #1a1916;
  color: #fff;
  padding: 52px 32px 44px;
  text-align: center;
  position: relative;
}
.lang-toggle {
  position: absolute;
  top: 16px;
  right: 16px;
  display: inline-flex;
  border: 1px solid #3a3934;
  border-radius: 99px;
  overflow: hidden;
}
.lang-toggle button {
  background: transparent;
  color: #888;
  border: 0;
  font: 600 12px/1 'Inter', sans-serif;
  letter-spacing: .06em;
  padding: 7px 13px;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.lang-toggle button.active { background: #fff; color: #1a1916; }
.eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #666;
  margin-bottom: 16px;
}
h1 {
  font-family: 'Sora', sans-serif;
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: -.03em;
  margin-bottom: 14px;
}
h1 span { color: #6b8fff; }
.sub {
  font-size: 1rem;
  color: #999;
  max-width: 520px;
  margin: 0 auto 32px;
  line-height: 1.65;
}
.stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
}
.stat-n {
  font-family: 'Sora', sans-serif;
  font-size: 1.8rem;
  font-weight: 800;
}
.stat-l {
  font-size: .75rem;
  color: #555;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-top: 2px;
}

/* MAIN */
main {
  max-width: 1060px;
  margin: 0 auto;
  padding: 36px 24px 80px;
}

/* TOOLBAR */
.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
}
.pill {
  border: 0.5px solid var(--border-strong);
  border-radius: 99px;
  padding: 5px 14px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  background: var(--surface);
  color: var(--muted);
  transition: background .15s, color .15s, border-color .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pill:hover { background: #f0efe9; color: var(--text); }
.pill.active { background: var(--text); color: var(--surface); border-color: var(--text); }
.pill.active.doc { background: var(--doc); border-color: var(--doc); color: #fff; }
.pill.active.eva { background: var(--eva); border-color: var(--eva); color: #fff; }
.pill.active.inv { background: var(--inv); border-color: var(--inv); color: #fff; }
.pill.active.sim { background: var(--sim); border-color: var(--sim); color: #fff; }
.pill.active.uti { background: var(--uti); border-color: var(--uti); color: #fff; }

.search-wrap {
  position: relative;
  margin-left: auto;
}
.search-wrap i {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 14px;
  pointer-events: none;
}
.search-wrap input {
  width: 210px;
  padding: 6px 12px 6px 32px;
  border: 0.5px solid var(--border-strong);
  border-radius: 99px;
  font-size: 13px;
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.search-wrap input:focus { border-color: var(--doc); }
.search-wrap input::placeholder { color: var(--muted); }

/* TABLE */
.table-wrap {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
table {
  width: 100%;
  border-collapse: collapse;
}
thead th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  padding: 10px 14px;
  text-align: left;
  background: #faf9f7;
  border-bottom: 0.5px solid var(--border);
}
tr.row {
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
  transition: background .1s;
}
tr.row:hover { background: #faf9f7; }
td {
  padding: 13px 14px;
  vertical-align: middle;
  font-size: 14px;
}
.icon-box {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #fff;
  flex-shrink: 0;
}
.icon-box.doc { background: var(--doc); }
.icon-box.eva { background: var(--eva); }
.icon-box.inv { background: var(--inv); }
.icon-box.sim { background: var(--sim); }
.icon-box.uti { background: var(--uti); }

.title-cell { font-weight: 500; }
.title-sub { font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 1px; }

.desc-cell { color: #555; font-size: 13px; max-width: 340px; }
.desc-cell span {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 99px;
  white-space: nowrap;
  letter-spacing: .03em;
}
.badge.doc { background: #dde8ff; color: var(--doc); }
.badge.eva { background: #fde9e3; color: var(--eva); }
.badge.inv { background: #d8f0e6; color: var(--inv); }
.badge.sim { background: #fbdcec; color: var(--sim); }
.badge.uti { background: #ede5fa; color: var(--uti); }

.link-td { width: 74px; text-align: right; white-space: nowrap; }
.link-td a, .link-td button {
  color: var(--muted);
  background: none;
  border: 0;
  cursor: pointer;
  font-size: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
  transition: color .15s, transform .2s;
}
.link-td a:hover, .link-td button:hover { color: var(--text); }
.link-td button.open i { transform: rotate(180deg); }
.link-td button i { transition: transform .2s; }

/* FICHA (detail row) */
tr.detail td {
  background: #faf9f7;
  border-bottom: 0.5px solid var(--border);
  padding: 16px 18px 18px;
}
.ficha {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 16px 24px;
}
.ficha .f-block h4 {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted);
  margin-bottom: 5px;
}
.ficha .f-block p { font-size: 13px; line-height: 1.55; color: #444; }
.doi-ok {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  color: var(--inv);
  text-decoration: none;
}
.doi-ok:hover { text-decoration: underline; }
.doi-pending {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  color: #8a6d1a;
  background: #f6ecd2;
  border-radius: 99px;
  padding: 3px 10px;
}
.cite-box {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.5;
  color: #555;
  background: #fff;
  border: 0.5px solid var(--border);
  border-radius: 8px;
  padding: 9px 11px;
}
.copy-cite {
  margin-top: 6px;
  font: 500 11px/1 'Inter', sans-serif;
  color: var(--doc);
  background: none;
  border: 0;
  cursor: pointer;
  padding: 0;
}
.copy-cite:hover { text-decoration: underline; }

.empty {
  text-align: center;
  padding: 60px 0;
  color: var(--muted);
  font-size: 14px;
}
.empty i { font-size: 28px; display: block; margin-bottom: 10px; }

/* FOOTER */
footer {
  background: var(--surface);
  border-top: 0.5px solid var(--border);
  padding: 28px 32px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}
footer a { color: #1a4fd8; text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .desc-cell, .desc-th { display: none; }
  .search-wrap input { width: 150px; }
  h1 { font-size: 2rem; }
  .lang-toggle { top: 10px; right: 10px; }
}
</style>
</head>

  </div>
</main>

    es:{ sub:"Examen imprevisible y anunciado", desc:"Contramedida docente de ConvocatorIA. Ejecuta el mismo motor de análisis contra los exámenes del propio profesor para medir cuánto le predice un estudiante, deriva la tabla de especificaciones de los resultados de aprendizaje y sortea el examen con deuda de rotación, control de dificultad y un bucle adversario que rechaza el sorteo si el predictor lo cubre por encima del umbral. Publica el plan de muestreo en una carta al estudiante. Es el reverso de ConvocatorIA: la app con la que el estudiante predice es el predictor contra el que aquí se mide el profesor.", tit:"", comp:"", evid:"Pendiente de registro sistemático de uso." },

  { cat:"doc", icon:"ti-scale", title:"CriterIA", url:"https://fborrasumh.github.io/criteria/", doi:"10.5281/zenodo.22171873",
    es:{ sub:"Usar IA en tus trabajos con criterio", desc:"Alfabetización en IA generativa para estudiantes: cinco niveles de uso permitido con lo que cabe y lo que no en cada uno, verificación en directo contra Crossref de si las referencias que da un modelo existen de verdad, bitácora de uso y generación de la declaración para el trabajo. Funciona sin clave de API.", tit:"Estudiantes de grado y máster · todas las titulaciones", comp:"Integridad académica · Alfabetización en IA · Verificación de fuentes", evid:"Pendiente de registro sistemático de uso." },
    en:{ sub:"Using AI in your coursework with judgement", desc:"AI literacy for university students: five levels of permitted use with what each allows and forbids, live Crossref verification of whether model-generated references actually exist, a usage log, and generation of the AI use declaration for the assignment. Works without an API key.", tit:"Undergraduate and master's students · all degrees", comp:"Academic integrity · AI literacy · Source verification", evid:"Systematic usage records pending." } },

];

/* ── LÓGICA ─────────────────────────────────────────── */
let lang = localStorage.getItem("ia_lang") || (new URLSearchParams(location.search).get("lang")) || "es";
if (lang !== "es" && lang !== "en") lang = "es";
let activeCat = "all";
const openFichas = new Set();

const catLabel = {
  es: { doc:"Docencia", eva:"Evaluación", inv:"Investigación", sim:"Simulación", uti:"Utilidades" },
  en: { doc:"Teaching", eva:"Assessment", inv:"Research", sim:"Simulation", uti:"Utilities" }
};

function t(key) { return ui[lang][key]; }

function setLang(l) {
  lang = l;
  localStorage.setItem("ia_lang", l);
  applyLang();
  render();
}

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById("btn-es").classList.toggle("active", lang === "es");
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
  document.getElementById("h1").innerHTML = t("h1");
  document.getElementById("q").placeholder = t("search");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    const map = { eyebrow:"eyebrow", sub:"sub", statTools:"statTools", statCats:"statCats", statBrowser:"statBrowser",
      all:"all", catDoc:"catDoc", catEva:"catEva", catInv:"catInv", catSim:"catSim", catUti:"catUti",
      thTool:"thTool", thDesc:"thDesc", thCat:"thCat", empty:"empty", footDev:"footDev", footKey:"footKey" };
    if (map[k]) el.textContent = t(map[k]);
  });
}

function setFilter(cat, el) {
  activeCat = cat;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active","doc","eva","inv","sim","uti"));
  el.classList.add("active");
  if (cat !== "all") el.classList.add(cat);
  render();
}

function citeText(a) {
  const year = new Date().getFullYear();
  const loc = a.doi ? "https://doi.org/" + a.doi : a.url;
  return "Borrás Rocher, F. (" + year + "). " + a.title + " [" + t("software") + "]. Universidad Miguel Hernández de Elche. " + loc;
}

function toggleFicha(i, btn) {
  const row = document.getElementById("detail-" + i);
  if (!row) return;
  const open = row.style.display !== "none";
  row.style.display = open ? "none" : "table-row";
  btn.classList.toggle("open", !open);
  const key = apps[i].url;
  if (open) openFichas.delete(key); else openFichas.add(key);
}

function copyCite(i, btn) {
  navigator.clipboard.writeText(citeText(apps[i])).then(() => {
    const prev = btn.textContent;
    btn.textContent = t("copied");
    setTimeout(() => { btn.textContent = prev; }, 1400);
  });
}

function esc(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render() {
  const q = (document.getElementById("q").value || "").toLowerCase();
  const rows = [];
  let visible = 0;

  apps.forEach((a, i) => {
    const L = a[lang];
    const hay = (a.title + " " + L.sub + " " + L.desc + " " + L.tit + " " + L.comp).toLowerCase();
    const mc = activeCat === "all" || a.cat === activeCat;
    const mq = !q || hay.includes(q);
    if (!(mc && mq)) return;
    visible++;

    const doiHtml = a.doi
      ? '<a class="doi-ok" href="https://doi.org/' + a.doi + '" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="ti ti-rosette-discount-check"></i> DOI ' + a.doi + '</a>'
      : '<span class="doi-pending"><i class="ti ti-clock"></i> ' + t("doiPending") + '</span>';

    const isOpen = openFichas.has(a.url);

    rows.push(
      '<tr class="row" onclick="window.open(\'' + a.url + '\',\'_blank\')">' +
        '<td><div class="icon-box ' + a.cat + '"><i class="ti ' + a.icon + '"></i></div></td>' +
        '<td class="title-cell">' + esc(a.title) + '<div class="title-sub">' + esc(L.sub) + '</div></td>' +
        '<td class="desc-cell"><span>' + esc(L.desc) + '</span></td>' +
        '<td><span class="badge ' + a.cat + '">' + catLabel[lang][a.cat] + '</span></td>' +
        '<td class="link-td">' +
          '<button class="' + (isOpen ? "open" : "") + '" title="' + t("showFicha") + '" aria-label="' + t("showFicha") + '" onclick="event.stopPropagation(); toggleFicha(' + i + ', this)"><i class="ti ti-chevron-down"></i></button>' +
          '<a href="' + a.url + '" target="_blank" rel="noopener" title="' + t("openApp") + ' ' + esc(a.title) + '" onclick="event.stopPropagation()"><i class="ti ti-external-link"></i></a>' +
        '</td>' +
      '</tr>' +
      '<tr class="detail" id="detail-' + i + '" style="display:' + (isOpen ? "table-row" : "none") + '" onclick="event.stopPropagation()">' +
        '<td colspan="5"><div class="ficha">' +
          '<div class="f-block"><h4>' + t("fTit") + '</h4><p>' + esc(L.tit) + '</p></div>' +
          '<div class="f-block"><h4>' + t("fComp") + '</h4><p>' + esc(L.comp) + '</p></div>' +
          '<div class="f-block"><h4>' + t("fEvid") + '</h4><p>' + esc(L.evid) + '</p></div>' +
          '<div class="f-block"><h4>' + t("fCite") + '</h4>' + doiHtml +
            '<div class="cite-box">' + esc(citeText(a)) + '</div>' +
            '<button class="copy-cite" onclick="copyCite(' + i + ', this)">' + t("copyCite") + '</button>' +
          '</div>' +
        '</div></td>' +
      '</tr>'
    );
  });

  document.getElementById("cnt-all").textContent = apps.length;
  document.getElementById("stat-total").textContent = apps.length;
  document.getElementById("empty").style.display = visible ? "none" : "block";
  document.getElementById("tbody").innerHTML = rows.join("");
}

applyLang();
render();
</script>
</body>
</html>
